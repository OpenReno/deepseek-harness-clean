# Sign + publish a Windows Tauri MSI for the desktop shell.
#
# Manual-only (workflow_dispatch) — never runs on push or PR. The signer
# private key is read from GitHub Actions secrets and the resulting MSI is
# uploaded to a GitHub Release so the updater endpoint can serve it.
#
# Required secrets:
#   TAURI_SIGNER_PRIVATE_KEY     — base64 of the raw 32-byte ed25519 seed
#                                  generated by `node desktop/scripts/generate-signer.mjs`.
#                                  The matching public key lives in
#                                  desktop/src-tauri/tauri.conf.json ->
#                                  plugins.updater.pubkey; rotating the
#                                  keypair requires updating both.
#
# Required variables:
#   tag                            — the GitHub tag (and MSI version) to release,
#                                  e.g. `desktop-v0.5.0`. Must match the
#                                  version in desktop/src-tauri/Cargo.toml +
#                                  tauri.conf.json or the build aborts.
#
# Outputs:
#   GitHub Release `desktop-<tag>` with the MSI asset and a generated
#   `latest.json` that the Tauri updater reads. The updater's `endpoints`
#   list in tauri.conf.json points at this release; the operator needs to
#   either (a) make the repo a public release or (b) upload latest.json
#   to releases.deepseek-harness.dev manually.
name: Release desktop (Windows MSI)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag for this release (e.g. desktop-v0.5.0). Must match version in Cargo.toml + tauri.conf.json.'
        required: true
        type: string
      dry_run:
        description: 'Build MSI but skip the GitHub Release publish.'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write   # upload the signed MSI to a GitHub Release
  actions: read

concurrency:
  # One signed release at a time per tag. A second dispatch waits for the
  # first to finish so two parallel runs don't fight over the same version.
  group: Release-desktop-${{ inputs.tag }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  CARGO_TERM_COLOR: 'never'

jobs:
  build:
    name: Build + sign MSI
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable, no postinstall scripts)
        # The lefthook postinstall at the root crashes inside this runner's
        # pnpm-store (static `import 'lefthook/package.json'` at the top of
        # install-lefthook.mjs fails before the CI early-return). LEFTHOOK=0
        # + --ignore-scripts keeps the install deterministic; CI doesn't need
        # git hooks anyway.
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Sanity check peer-dep deploy
        # Run the post-deploy smoke test before the long Rust build. A failure
        # here points to a missing apps/cli/package.json entry, which would
        # only manifest at runtime — catching it up front saves the 10-minute
        # build cycle.
        run: node desktop/scripts/check-peer-deps.cjs

      - name: Build sidecar + bundle MSI
        env:
          # tauri build reads TAURI_SIGNER_PRIVATE_KEY and signs the produced
          # MSI/.sig automatically; the public key in tauri.conf.json ->
          # plugins.updater.pubkey is the verification counterpart. Never echo
          # this env var to logs.
          TAURI_SIGNER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNER_PRIVATE_KEY }}
          # Uncomment if the seed is wrapped with a passphrase (recommended
          # for any keypair with blast radius beyond a single repo).
          # TAURI_SIGNER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNER_PRIVATE_KEY_PASSWORD }}
          CI: 'true'
          LEFTHOOK: '0'
        shell: bash
        run: |
          set -euo pipefail
          cd desktop/src-tauri
          ../node_modules/.bin/tauri build --bundles msi

      - name: Locate MSI artifact
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          MSI=$(find target/release/bundle/msi -name '*.msi' -type f | head -n1)
          echo "msi_path=$MSI" >> "$GITHUB_OUTPUT"
          echo "msi_name=$(basename "$MSI")" >> "$GITHUB_OUTPUT"
          echo "msi_size=$(wc -c < "$MSI")" >> "$GITHUB_OUTPUT"

      - name: Verify version matches the requested tag
        shell: bash
        run: |
          set -euo pipefail
          MSI="${{ steps.locate.outputs.msi_path }}"
          TAG="${{ inputs.tag }}"
          # The MSI ProductVersion is encoded in the filename: *_x64_en-US.msi
          # lands with the version from Cargo.toml embedded. Pull it back out
          # so a wrong tag fails loud instead of publishing a mismatched MSI.
          EXPECTED="${TAG#desktop-v}"
          ACTUAL=$(echo "$MSI" | sed -E 's/.*_([0-9.]+)_x64_en-US\.msi/\1/')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::MSI version ($ACTUAL) does not match tag version ($EXPECTED)"
            echo "Bump the version inside desktop/src-tauri/{Cargo.toml,tauri.conf.json} before re-running."
            exit 1
          fi

      - name: Generate updater latest.json
        # Tauri's updater protocol expects latest.json with: version, notes,
        # pub_date, platforms.{target}.{url,signature}. The signature is the
        # ed25519 signature of the MSI file, computed against the same
        # TAURI_SIGNER_PRIVATE_KEY the build was signed with.
        shell: bash
        env:
          TAURI_SIGNER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          MSI_PATH="${{ steps.locate.outputs.msi_path }}"
          MSI_NAME="${{ steps.locate.outputs.msi_name }}"
          VERSION="${TAG#desktop-v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/${MSI_NAME}"
          SIGNATURE=$(node desktop/scripts/sign-msi.mjs "$MSI_PATH")
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "url": "${ASSET_URL}",
                "signature": "${SIGNATURE}"
              }
            }
          }
          EOF
          echo "Wrote latest.json with signature ${SIGNATURE:0:32}..."

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-msi
          path: ${{ steps.locate.outputs.msi_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload latest.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-latest-json
          path: latest.json
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: ${{ inputs.dry_run == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.locate.outputs.msi_path }}
            latest.json
