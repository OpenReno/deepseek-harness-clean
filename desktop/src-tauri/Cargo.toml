[package]
name = "dsh-desktop"
version = "0.1.1-rc.2"
edition = "2021"
rust-version = "1.85"
description = "Tauri shell for DeepSeek Harness — thin OS layer only"
license = "MIT"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 + minimal plugin set
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "net", "io-util"] }

# HTTP (outbound, proxy-aware, streaming)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

# OS keyring
keyring = "3"

# Errors + serialization
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Misc
url = "2"
sha2 = "0.10"
once_cell = "1"
futures-util = "0.3"
parking_lot = "0.12"
log = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
